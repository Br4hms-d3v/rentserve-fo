<div [ngClass]="{'dark-mode': isDarkMode, 'light-mode': !isDarkMode}" class="userMaterialReview">
  <p>Souhaitez-vous supprimer votre commentaire ?</p>
  <button
    id="btn-delete"
    size="m"
    tuiButton
    (click)="onDelete()"
  >Oui
  </button>

  <button
    id="btn-cancel"
    size="m"
    tuiButton
    (click)="onBack()"
  >
    Non
  </button>
</div>

<ng-template
  [tuiNotificationOptions]="{label: 'Commentaire', autoClose: 0, closable: false, appearance: isSuccess() ? 'positive' : 'negative',}"
  [(tuiNotification)]="show"
>
  <span tuiSubtitle>{{ messageSuccess || messageError }}</span>
  <button
    tuiButton
    type="button"
    (click)="show.set(false)"
  >
    Close
  </button>
</ng-template>
