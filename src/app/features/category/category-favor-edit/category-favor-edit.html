<div class="editCategory-container" [ngClass]="{'dark-mode': isDarkMode, 'light-mode': !isDarkMode}">
  <!-- Breadcrumbs -->
  <tui-breadcrumbs>
    @for (link of links; track link) {
      <a
        *tuiItem
        tuiLink
        [routerLink]="link.routerLink"
      >
        {{ link.caption }}
      </a>
    }
  </tui-breadcrumbs>


  <h1 id="titleEditCategory">
    {{ title }}
  </h1>

  <form [formGroup]="editCategoryFavorForm" (ngSubmit)="onSubmitEditCategoryFavor()" class="category-form">
    <tui-textfield>
      <label tuiLabel> Nom de la catégorie</label>
      <input
        tuiInput
        type="text"
        formControlName="nameCategory"
      />
    </tui-textfield>

    <button
      tuiButton
      id="cancelDelete"
      type="button"
      appearance="primary"
      size="xl"
      [routerLink]="['/dashboard']"
    >
      Retour
    </button>

    <button
      tuiButton
      id="butonUpdate"
      type="submit"
      appearance="primary"
      size="xl"
    >
      Modifier
    </button>
  </form>

</div>

<ng-template
  [tuiNotificationOptions]="{label: 'Modification', autoClose: 0, closable: false, appearance: isSuccess() ? 'positive' : 'negative',}"
  [(tuiNotification)]="show"
>
  <span tuiSubtitle>{{ messageSuccess || messageError }}</span>
  <button
    tuiButton
    type="button"
    (click)="show.set(false)"
  >
    Close
  </button>
</ng-template>
