<div
  class="dashboard"
  [class.dark-mode]="isDarkMode()"
  [class.light-mode]="!isDarkMode()"
>
  <main class="dashboard-content">
    <header class="dashboard-heading">
      <div>
        <h1>{{ 'dashboard.title' | transloco }}</h1>
        <p>
          {{ 'dashboard.description' | transloco }}
        </p>
      </div>
    </header>

    <section
      class="dashboard-categories"
      [attr.aria-label]="'dashboard.categories.ariaLabel' | transloco"
    >
      <article class="category-panel">
        <app-category-material />
      </article>

      <article class="category-panel">
        <app-category-favor />
      </article>
    </section>
  </main>
</div>
