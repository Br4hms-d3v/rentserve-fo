<div
  class="dashboard"
  [class.dark-mode]="isDarkMode()"
  [class.light-mode]="!isDarkMode()"
>
  <main class="dashboard-content">
    <header class="dashboard-heading">
      <div>
        <h1>Bienvenue sur RentServe</h1>
        <p>
          Découvrez le matériel à louer et les services disponibles près de chez vous.
        </p>
      </div>
    </header>

    <section
      class="dashboard-categories"
      aria-label="Catégories disponibles"
    >
      <article class="category-panel">
        <app-category-material />
      </article>

      <article class="category-panel">
        <app-category-favor />
      </article>
    </section>
  </main>
</div>
