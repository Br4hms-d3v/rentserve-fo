<div class="editUser" [ngClass]="{'dark-mode': isDarkMode, 'light-mode': !isDarkMode}">

  <form [formGroup]="editUserForm">

    <div class="form-field">
      <tui-textfield>
        <label tuiLabel>Nom</label>
        <input tuiInput formControlName="name" />
      </tui-textfield>
    </div>

    <div class="form-field">
      <tui-textfield>
        <label tuiLabel>Prénom</label>
        <input tuiInput formControlName="firstName" />
      </tui-textfield>
    </div>

    <div class="form-field form-field--street--email">
      <tui-textfield>
        <label tuiLabel>Email</label>
        <input tuiInput formControlName="email" />
      </tui-textfield>
    </div>

    <div class="form-field">
      <tui-textfield>
        <label tuiLabel>Pseudo</label>
        <input tuiInput formControlName="pseudo" />
      </tui-textfield>
    </div>

    <div class="form-field">
      <tui-textfield>
        <label tuiLabel>Date de naissance</label>
        <input tuiInputDate formControlName="birthdate" />
        <tui-calendar *tuiDropdown></tui-calendar>

      </tui-textfield>
    </div>

    <!-- Street takes 2 columns -->
    <div class="form-field form-field--street--email">
      <tui-textfield>
        <label tuiLabel>Rue</label>
        <input tuiInput formControlName="street" />
      </tui-textfield>
    </div>

    <!-- City -->
    <div class="form-field">
      <tui-textfield>
        <label tuiLabel>Ville</label>
        <input tuiInput formControlName="city" />
      </tui-textfield>
    </div>

    <!-- ZipCode -->
    <div class="form-field">
      <tui-textfield>
        <label tuiLabel>Code postal</label>
        <input tuiInput formControlName="zipCode" />
      </tui-textfield>
    </div>

    <!-- Button cancel -->
    <div class="btn-cancel">
      <button tuiButton
              type="submit"
              appearance="primary"
      >Annuler
      </button>
    </div>

    <!-- Button to register -->
    <div class="btn-register">
      <button tuiButton
              type="submit"
              appearance="primary"
      >S'inscrire
      </button>
    </div>

  </form>

</div>
