
<div class="editUser-container">

  <form
    [formGroup]="editUserForm"
    (ngSubmit)="updateUser()"
    class="user-form"
  >

    <div class="inputMatField">
      <tui-textfield>
        <label tuiLabel>Nom</label>
        <input tuiInput formControlName="name" />
      </tui-textfield>
    </div>

    <div class="inputMatField">
      <tui-textfield>
        <label tuiLabel>Prénom</label>
        <input tuiInput formControlName="firstName" />
      </tui-textfield>
    </div>

    <div class="form-field form-field--street--email">
      <tui-textfield>
        <label tuiLabel>Adresse e-mail</label>
        <input tuiInput formControlName="email" />
      </tui-textfield>
    </div>

    <div class="inputMatField">
      <tui-textfield>
        <label tuiLabel>Pseudo</label>
        <input tuiInput formControlName="pseudo" />
      </tui-textfield>
    </div>

    <div class="inputMatField">
      <tui-textfield>
        <label tuiLabel>Date de naissance</label>
        <input tuiInputDate formControlName="birthdate" />
        <tui-calendar *tuiDropdown />
      </tui-textfield>
    </div>

    <!-- Rue -->
    <div class="form-field form-field--street--email">
      <tui-textfield>
        <label tuiLabel>Rue</label>
        <input tuiInput formControlName="street" />
      </tui-textfield>
    </div>

    <!-- Ville -->
    <div class="inputMatField">
      <tui-textfield>
        <label tuiLabel>Ville</label>
        <input tuiInput formControlName="city" />
      </tui-textfield>
    </div>

    <!-- Code postal -->
    <div class="inputMatField">
      <tui-textfield>
        <label tuiLabel>Code postal</label>
        <input tuiInput formControlName="zipCode" />
      </tui-textfield>
    </div>

    <!-- Bouton Annuler -->
    <div class="btn-cancel">
      <button
        tuiButton
        type="button"
        appearance="secondary"
        (click)="onCancel()"
      >
        Annuler
      </button>
    </div>

    <!-- Bouton Sauvegarder -->
    <div class="btn-register">
      <button
        tuiButton
        type="submit"
        appearance="primary"
        [disabled]="editUserForm.invalid || editUserForm.pristine"
      >
        Sauvegarder
      </button>
    </div>

  </form>

</div>

<!-- Notification -->
<ng-template
  [tuiNotificationOptions]="{
    label: 'Modification du profil',
    autoClose: 0,
    closable: false,
    appearance: isSuccess() ? 'positive' : 'negative'
  }"
  [(tuiNotification)]="show"
>
  <span tuiSubtitle>
    {{ messageSuccess || messageError }}
  </span>

  <button
    tuiButton
    type="button"
    (click)="show.set(false)"
  >
    Fermer
  </button>
</ng-template>
