<div class="changePassword-container" [ngClass]="{'dark-mode': isDarkMode, 'light-mode': !isDarkMode}">

  <h1>{{ title }}</h1>

  <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()" class="user-form">


    <tui-textfield class="form-field form-field--email--password" iconStart="@tui.at-sign">
      <label tuiLabel>Email</label>
      <input tuiInput type="email" formControlName="email" />
    </tui-textfield>


    <tui-textfield class="form-field--email--password" iconStart="@tui.key-round">
      <label tuiLabel>Mot de passe</label>
      <input tuiInput type="password" #passwordInput [type]="passwordInput.type" formControlName="password" />

      <button
        class="custom-icon-textfield"
        appearance="secondary"
        size="m"
        tuiButton
        type="button"
        (click)="passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password'"
      >
        <tui-icon
          [icon]="passwordInput.type === 'password' ? '@tui.eye' : '@tui.eye-off'"></tui-icon>
      </button>
    </tui-textfield>


    <tui-textfield class="form-field--email--password" iconStart="@tui.key-round">
      <label tuiLabel>Comfirmation du mot de passe</label>
      <input tuiInput type="password" #passwordComparedInput formControlName="comparePassword" [type]="passwordComparedInput.type" />

      <button
        class="custom-icon-textfield"
        appearance="secondary"
        size="m"
        tuiButton
        type="button"
        (click)="passwordComparedInput.type = passwordComparedInput.type === 'password' ? 'text' : 'password'"
      >
        <tui-icon
          [icon]="passwordComparedInput.type === 'password' ? '@tui.eye' : '@tui.eye-off'"></tui-icon>
      </button>
    </tui-textfield>


    <!-- Button to update password -->
    <button tuiButton
            type="submit"
            appearance="primary"
            class="button-update"
    >Modifier
    </button>

  </form>

  <!-- Button to cancel -->
  <button tuiButton
          type="submit"
          appearance="primary"
          class="button-cancel"
          (click)="reset()"
  >Annuler
  </button>
</div>

<ng-template
  [tuiNotificationOptions]="{label: 'Message: ', autoClose: 0, closable: false, appearance: isSuccess() ? 'positive' : 'negative',}"
  [(tuiNotification)]="show"
>
  <span tuiSubtitle>{{ messageSuccess || messageError }}</span>
  <button
    tuiButton
    type="button"
    (click)="show.set(false)"
  >
    Close
  </button>
</ng-template>
