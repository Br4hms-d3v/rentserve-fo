<div class="changePassword-container" [ngClass]="{'dark-mode': isDarkMode, 'light-mode': !isDarkMode}">

  <h1>{{ title }}</h1>

  <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()">

    <div class="form-field form-field--email--password">
      <tui-textfield>
        <label tuiLabel>Email</label>
        <input tuiInput formControlName="email" />
      </tui-textfield>
    </div>

    <div class="form-field form-field--email--password">
      <tui-textfield>
        <label tuiLabel>Mot de passe</label>
        <input tuiInput formControlName="password" />
      </tui-textfield>
    </div>

    <div class="form-field form-field--email--password">
      <tui-textfield>
        <label tuiLabel>Comfirmation du mot de passe</label>
        <input tuiInput formControlName="comparePassword" />
      </tui-textfield>
    </div>

    <!-- Button to register -->
    <div class="btn-register">
      <button tuiButton
              type="submit"
              appearance="primary"
      >Modifier
      </button>
    </div>

  </form>
</div>
