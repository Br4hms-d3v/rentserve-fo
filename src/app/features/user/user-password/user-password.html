<div
  class="changePassword-container"
>

  <header class="password-header">
    <div class="header-icon">
      <tui-icon icon="@tui.shield-check"></tui-icon>
    </div>

    <h1>{{ title }}</h1>

    <p>
      Modifiez votre mot de passe pour garantir
      la sécurité de votre compte.
    </p>
  </header>

  <div class="password-divider"></div>

  <form
    [formGroup]="changePasswordForm"
    (ngSubmit)="changePassword()"
    class="user-form"
  >

    <!-- Email -->
    <tui-textfield
      class="form-field"
      iconStart="@tui.at-sign"
    >
      <label tuiLabel>Adresse e-mail</label>
      <input
        tuiInput
        type="email"
        formControlName="email"
        autocomplete="email"
      />
    </tui-textfield>

    <!-- Nouveau mot de passe -->
    <tui-textfield
      class="form-field"
      iconStart="@tui.lock"
    >
      <label tuiLabel>Nouveau mot de passe</label>

      <input
        tuiInput
        #passwordInput
        [type]="passwordInput.type"
        formControlName="password"
        autocomplete="new-password"
      />

      <button
        tuiButton
        type="button"
        appearance="flat"
        size="m"
        class="password-toggle"
        aria-label="Afficher ou masquer le mot de passe"
        (click)="passwordInput.type =
            passwordInput.type === 'password' ? 'text' : 'password'"
      >
        <tui-icon
          [icon]="passwordInput.type === 'password'
              ? '@tui.eye'
              : '@tui.eye-off'"
        ></tui-icon>
      </button>
    </tui-textfield>

    <!-- Confirmation -->
    <tui-textfield
      class="form-field"
      iconStart="@tui.lock"
    >
      <label tuiLabel>Confirmer le mot de passe</label>

      <input
        tuiInput
        #passwordComparedInput
        [type]="passwordComparedInput.type"
        formControlName="comparePassword"
        autocomplete="new-password"
      />

      <button
        tuiButton
        type="button"
        appearance="flat"
        size="m"
        class="password-toggle"
        aria-label="Afficher ou masquer la confirmation"
        (click)="passwordComparedInput.type =
            passwordComparedInput.type === 'password' ? 'text' : 'password'"
      >
        <tui-icon
          [icon]="passwordComparedInput.type === 'password'
              ? '@tui.eye'
              : '@tui.eye-off'"
        ></tui-icon>
      </button>
    </tui-textfield>

    <!-- Conseil -->
    <div class="security-info">
      <tui-icon icon="@tui.info"></tui-icon>

      <p>
        Pour renforcer la sécurité de votre compte,
        utilisez un mot de passe long et unique.
      </p>
    </div>

    <!-- Actions -->
    <div class="form-actions">

      <button
        tuiButton
        type="submit"
        appearance="primary"
        class="button-update"
      >
        <tui-icon icon="@tui.check"></tui-icon>
        Modifier le mot de passe
      </button>

      <button
        tuiButton
        type="button"
        appearance="secondary"
        class="button-cancel"
        (click)="reset()"
      >
        Annuler
      </button>

    </div>

  </form>

</div>

<!-- Notifications -->
<ng-template
  [tuiNotificationOptions]="{
    label: isSuccess() ? 'Succès' : 'Erreur',
    autoClose: 5000,
    closable: true,
    appearance: isSuccess() ? 'positive' : 'negative'
  }"
  [(tuiNotification)]="show"
>
  <span tuiSubtitle>
    {{ messageSuccess || messageError }}
  </span>
</ng-template>
