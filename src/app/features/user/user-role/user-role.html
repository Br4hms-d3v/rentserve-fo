<p>
  Nom : {{ user.name }}
</p>

<p>
  Rôle : {{ user.role }}
</p>

<form
  [formGroup]="editUserRoleForm"
  (ngSubmit)="updateUSerRole()"
>
  <tui-textfield tuiChevron>
    <input
      tuiSelect
      formControlName="role"
      placeholder="Choisir un rôle"
    />

    <tui-data-list-wrapper
      *tuiDropdown
      [items]="roles"
    />
  </tui-textfield>

  @if (messageError) {
    <p>{{ messageError }}</p>
  }

  <button
    tuiButton
    type="submit"
    [disabled]="editUserRoleForm.invalid"
  >
    Enregistrer
  </button>
</form>

<ng-template
  [tuiNotificationOptions]="{label: 'Changement de role', autoClose: 0, closable: false, appearance: isSuccess() ? 'positive' : 'negative',}"
  [(tuiNotification)]="show"
>
  <span tuiSubtitle>{{ messageSuccess || messageError }}</span>
  <button
    tuiButton
    type="button"
    (click)="show.set(false)"
  >
    Close
  </button>
</ng-template>
