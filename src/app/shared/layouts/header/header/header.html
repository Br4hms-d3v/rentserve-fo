
<header
  class="header-toolbar"
  [class.dark-mode]="isDarkMode"
  [class.light-mode]="!isDarkMode"
>
  <!-- Sélection de la langue -->
  <div class="lang-selector">
    <button
      tuiIconButton
      type="button"
      appearance="flat"
      size="s"
      iconStart="@tui.globe"
      class="icon-btn"
      aria-label="Choisir la langue"
      title="Choisir la langue"
      [tuiDropdown]="languageMenu"
      [(tuiDropdownOpen)]="dropdownOpen"
    ></button>

    <span class="lang-text" aria-live="polite">
      {{
        selectedLanguage === 'fr'
          ? 'BE - Français'
          : selectedLanguage === 'nl'
            ? 'NL - Nederlands'
            : selectedLanguage === 'en'
              ? 'EN - English'
              : 'DE - Deutsch'
      }}
    </span>
  </div>

  <!-- Menu déroulant des langues -->
  <ng-template #languageMenu>
    <tui-data-list>
      <button
        tuiOption
        type="button"
        (click)="selectLanguage('fr')"
      >
        <img
          src="/languages/belgium.png"
          alt=""
          class="flag-icon"
        />
        <span>BE - Français</span>
      </button>

      <button
        tuiOption
        type="button"
        (click)="selectLanguage('nl')"
      >
        <img
          src="/languages/netherlands.png"
          alt=""
          class="flag-icon"
        />
        <span>NL - Nederlands</span>
      </button>

      <button
        tuiOption
        type="button"
        (click)="selectLanguage('de')"
      >
        <img
          src="/languages/german-flag.png"
          alt=""
          class="flag-icon"
        />
        <span>DE - Deutsch</span>
      </button>

      <button
        tuiOption
        type="button"
        (click)="selectLanguage('en')"
      >
        <img
          src="/languages/uk-flag.png"
          alt=""
          class="flag-icon"
        />
        <span>EN - English</span>
      </button>
    </tui-data-list>
  </ng-template>

  <span class="spacer" aria-hidden="true"></span>

  <!-- Changement de thème -->
  <div class="theme-selector">
    <button
      tuiIconButton
      type="button"
      appearance="flat"
      size="s"
      [iconStart]="isDarkMode ? '@tui.moon' : '@tui.sun'"
      class="icon-btn"
      [attr.aria-label]="
        isDarkMode
          ? 'Activer le thème clair'
          : 'Activer le thème sombre'
      "
      [attr.title]="
        isDarkMode
          ? 'Activer le thème clair'
          : 'Activer le thème sombre'
      "
      (click)="toggleTheme()"
    ></button>

    <span class="theme-text">
      {{ isDarkMode ? 'Thème sombre' : 'Thème clair' }}
    </span>
  </div>
</header>
