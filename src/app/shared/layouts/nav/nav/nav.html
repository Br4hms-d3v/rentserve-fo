<header class="toolbar" [ngClass]="{ 'dark-mode': isDarkMode, 'light-mode': !isDarkMode }">
  <!-- Logo is on left -->
  <a [routerLink]="['dashboard']" class="logo-link">
    <img src="/logo/logoSmall.jpg" alt="Logo" class="logo" />
    <span id="logoText">Rent-Serve</span>
  </a>

  <!-- Space between buttons -->
  <span class="spacer"></span>


  @if (isAuthenticated()) {
    <!-- First button materials  -->
    <button
      tuiButton
      type="button"
      [routerLink]="['/material', 'all-materials']"
      size="m"
      appearance="flat"
      iconEnd="@tui.hammer"
      class="btn-rentServeBasket"
    >
      Matériels
    </button>

    <!-- Space between buttons -->
    <span class="spaceBtwnMatFav"></span>

    <!-- Second button favour  -->
    <button
      tuiButton
      type="button"
      [routerLink]="['/favor', 'all-favour']"
      size="m"
      appearance="flat"
      iconEnd="@tui.heart-handshake"
      class="btn-rentServeBasket"
    >
      Services
    </button>
  }

  <!-- Space between buttons -->
  <span class="spacer"></span>

  <!-- Display the button when the user is connected -->
  <div class="action-buttons">
    @if (isAuthenticated()) {
      <button
        tuiButton
        type="button"
        size="m"
        appearance="custom"
        iconEnd="@tui.shopping-bag"
        class="btn-rentServeBasket"
      >
        Panier
      </button>

      <!-- Drawer to see any dropMenu -->
      <button
        class="btn-login"
        tuiButton
        iconEnd="@tui.chevrons-right"
        type="button"
        iconStart="@tui.user"
        (click)="openDrawer.set(true)"
      >
        {{ firstname }}
      </button>

    } @else {
      <button
        tuiButton
        type="button"
        size="m"
        appearance="custom"
        iconEnd="@tui.user"
        routerLink="/auth/login"
        class="btn-login"
      >
        Connexion
      </button>
    }
  </div>
</header>

<!-- Drawer -->

<tui-drawer
  *tuiPopup="openDrawer()"
  direction="end"
  class="drawer"
  [overlay]="true"
  (tuiClose)="onClose()"
>
  <header class="header">
    <h2 tuiHeader>
      <div tuiTitle>{{ firstname }}</div>

      <div tuiAccessories>
        <button tuiButton type="button" (click)="onClose()">
          X
        </button>
      </div>
    </h2>
  </header>

  <div class="drawer-links">
    <div class="link-drawer">
      <a [routerLink]="['user', 'profile']" (click)="onClose()">
        Voir mon profil
      </a>
    </div>

    <div class="link-drawer">
      <a [routerLink]="['user-material', 'my-user-material']" (click)="onClose()">Mes outils</a>
    </div>

    <div class="link-drawer">
      <a>Mes services</a>
    </div>

    <div class="link-drawer">
      <a>Voir mon solde</a>
    </div>
  </div>

  <footer>
    <a
      type="button"
      (click)="logout()">
      Deconnecter
    </a>
  </footer>
</tui-drawer>
