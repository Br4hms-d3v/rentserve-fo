<header
  class="toolbar"
  [ngClass]="{
    'dark-mode': isDarkMode,
    'light-mode': !isDarkMode
  }"
>
  <!-- Logo -->
  <a [routerLink]="['dashboard']" class="logo-link">
    <img
      src="/logo/logoSmall.jpg"
      alt=""
      class="logo"
    />
    <span id="logoText">Rent-Serve</span>
  </a>

  <span class="spacer"></span>

  <!-- Navigation -->
  @if (isAuthenticated()) {
    <nav class="nav-buttons" aria-label="Navigation principale">
      <button
        tuiButton
        type="button"
        [routerLink]="['/material', 'all-materials']"
        size="m"
        appearance="flat"
        iconEnd="@tui.hammer"
        class="btn-rentServeBasket"
      >
        Matériels
      </button>

      <button
        tuiButton
        type="button"
        [routerLink]="['/favor', 'all-favour']"
        size="m"
        appearance="flat"
        iconEnd="@tui.heart-handshake"
        class="btn-rentServeBasket"
      >
        Services
      </button>
    </nav>
  }

  <span class="spacer"></span>

  <!-- Actions utilisateur -->
  <div class="action-buttons">
    @if (isAuthenticated()) {
      <button
        tuiButton
        type="button"
        size="m"
        appearance="custom"
        iconEnd="@tui.shopping-bag"
        class="btn-rentServeBasket btn-cart"
      >
        Panier
      </button>

      <button
        tuiButton
        type="button"
        iconStart="@tui.user"
        iconEnd="@tui.chevrons-right"
        class="btn-login"
        [attr.aria-label]="'Ouvrir le menu de ' + firstname"
        (click)="openDrawer.set(true)"
      >
        <span class="user-name">{{ firstname }}</span>
      </button>
    } @else {
      <button
        tuiButton
        type="button"
        size="m"
        appearance="custom"
        iconEnd="@tui.user"
        routerLink="/auth/login"
        class="btn-login"
      >
        Connexion
      </button>
    }
  </div>
</header>

<!-- Drawer utilisateur -->
<tui-drawer
  *tuiPopup="openDrawer()"
  direction="end"
  class="drawer"
  [overlay]="true"
  (tuiClose)="onClose()"
>
  <header class="drawer-header">
    <h2 tuiHeader>
      <div tuiTitle>{{ firstname }}</div>

      <div tuiAccessories>
        <button
          tuiButton
          type="button"
          appearance="flat"
          aria-label="Fermer le menu"
          (click)="onClose()"
        >
          X
        </button>
      </div>
    </h2>
  </header>

  <nav class="drawer-links" aria-label="Menu utilisateur">
    <div class="link-drawer">
      <a [routerLink]="['user', 'profile']" (click)="onClose()">
        Voir mon profil
      </a>
    </div>

    <div class="link-drawer">
      <a
        [routerLink]="['user-material', 'my-user-material']"
        (click)="onClose()"
      >
        Mes outils
      </a>
    </div>

    <div class="link-drawer">
      <a
        [routerLink]="['user-favor', 'my-user-favor']"
        (click)="onClose()"
      >
        Mes services
      </a>
    </div>

    <div class="link-drawer">
      <a
        [routerLink]="['earn', 'my-earn-this-month', userId]"
        (click)="onClose()"
      >
        Voir mon solde
      </a>
    </div>
  </nav>

  <footer class="drawer-footer">
    <button
      tuiButton
      type="button"
      class="btn-logout"
      (click)="logout()"
    >
      Déconnexion
    </button>
  </footer>
</tui-drawer>
