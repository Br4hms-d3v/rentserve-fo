
<header
  class="toolbar"
  [ngClass]="{
    'dark-mode': isDarkMode,
    'light-mode': !isDarkMode
  }"
>
  <!-- Logo RentServe -->
  <a
    [routerLink]="['dashboard']"
    class="logo-link"
    aria-label="RentServe — Accueil"
  >
    <img
      src="/logo/logoSmall.jpg"
      alt=""
      class="logo"
    />
    <span id="logoText">RentServe</span>
  </a>

  <span class="spacer" aria-hidden="true"></span>

  <!-- Navigation principale -->
  @if (isAuthenticated()) {
    <nav
      class="nav-buttons"
      aria-label="Navigation principale"
    >
      <button
        tuiButton
        type="button"
        appearance="flat"
        size="m"
        iconEnd="@tui.hammer"
        class="btn-rentServeBasket"
        [routerLink]="['/material', 'all-materials']"
        routerLinkActive="nav-active"
        aria-label="Consulter les matériels"
      >
        Matériels
      </button>

      <button
        tuiButton
        type="button"
        appearance="flat"
        size="m"
        iconEnd="@tui.heart-handshake"
        class="btn-rentServeBasket"
        [routerLink]="['/favor', 'all-favour']"
        routerLinkActive="nav-active"
        aria-label="Consulter les services"
      >
        Services
      </button>
    </nav>
  }

  <span class="spacer" aria-hidden="true"></span>

  <!-- Actions utilisateur -->
  <div class="action-buttons">
    @if (isAuthenticated()) {
      <button
        tuiButton
        type="button"
        size="m"
        appearance="custom"
        iconEnd="@tui.shopping-bag"
        class="btn-rentServeBasket btn-cart"
        [routerLink]="['/rental', 'basket', userId]"
        aria-label="Ouvrir mon panier"
      >
        Panier
      </button>

      <button
        tuiButton
        type="button"
        iconStart="@tui.user"
        iconEnd="@tui.chevrons-right"
        class="btn-login"
        [attr.aria-label]="'Ouvrir le menu de ' + (firstname ?? 'mon compte')"
        [attr.aria-expanded]="openDrawer()"
        (click)="openDrawer.set(true)"
      >
        <span class="user-name">{{ firstname }}</span>
      </button>
    } @else {
      <button
        tuiButton
        type="button"
        size="m"
        appearance="custom"
        iconEnd="@tui.user"
        routerLink="/auth/login"
        class="btn-login"
      >
        Connexion
      </button>
    }
  </div>
</header>

<!-- Menu latéral du compte utilisateur -->
<tui-drawer
  *tuiPopup="openDrawer()"
  direction="end"
  class="drawer"
  [overlay]="true"
  (tuiClose)="onClose()"
>
  <header class="drawer-header">
    <h2 tuiHeader>
      <div tuiTitle>Mon compte</div>

      <div tuiAccessories>
        <button
          tuiButton
          type="button"
          appearance="flat"
          aria-label="Fermer le menu"
          (click)="onClose()"
        >
          Fermer
        </button>
      </div>
    </h2>

    <p>{{ firstname }}</p>
  </header>

  <nav
    class="drawer-links"
    aria-label="Menu utilisateur"
  >
    <div class="link-drawer">
      <a
        [routerLink]="['user', 'profile']"
        routerLinkActive="nav-active"
        (click)="onClose()"
      >
        <span>Mon profil</span>
      </a>
    </div>

    <div class="link-drawer">
      <a
        [routerLink]="['user-material', 'my-user-material']"
        routerLinkActive="nav-active"
        (click)="onClose()"
      >
        <span>Mes outils</span>
      </a>
    </div>

    <div class="link-drawer">
      <a
        [routerLink]="['user-favor', 'my-user-favor']"
        routerLinkActive="nav-active"
        (click)="onClose()"
      >
        <span>Mes services</span>
      </a>
    </div>

    <div class="link-drawer">
      <a
        [routerLink]="['earn', 'my-earn-this-month', userId]"
        routerLinkActive="nav-active"
        (click)="onClose()"
      >
        <span>Mon solde</span>
      </a>
    </div>
  </nav>

  <footer class="drawer-footer">
    <button
      tuiButton
      type="button"
      class="btn-logout"
      (click)="logout()"
    >
      Déconnexion
    </button>
  </footer>
</tui-drawer>
