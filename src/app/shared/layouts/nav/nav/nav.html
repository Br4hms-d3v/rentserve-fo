
<header
  class="toolbar"
  [ngClass]="{
    'dark-mode': isDarkMode,
    'light-mode': !isDarkMode
  }"
>
  <!-- =====================================
       LOGO RENTSERVE
       ===================================== -->

  <a
    [routerLink]="['dashboard']"
    class="logo-link"
    aria-label="RentServe — Accueil"
  >
    <img
      src="/logo/logoSmall.jpg"
      alt=""
      class="logo"
    />

    <span class="logo-text">RentServe</span>
  </a>

  <!-- =====================================
       NAVIGATION PRINCIPALE
       ===================================== -->

  @if (isAuthenticated()) {
    <nav
      class="nav-buttons"
      aria-label="Navigation principale"
    >
      <!-- MATÉRIELS -->

      <a
        tuiButton
        type="button"
        appearance="flat"
        size="m"
        iconStart="@tui.hammer"
        class="nav-link"
        [routerLink]="['/material', 'all-materials']"
        routerLinkActive="nav-active"
        aria-label="Consulter les matériels"
        title="Matériels"
      >
        <span class="button-label">
          Matériels
        </span>
      </a>

      <!-- SERVICES -->

      <a
        tuiButton
        type="button"
        appearance="flat"
        size="m"
        iconStart="@tui.heart-handshake"
        class="nav-link"
        [routerLink]="['/favor', 'all-favour']"
        routerLinkActive="nav-active"
        aria-label="Consulter les services"
        title="Services"
      >
        <span class="button-label">
          Services
        </span>
      </a>
    </nav>
  }

  <!-- =====================================
       ACTIONS UTILISATEUR
       ===================================== -->

  <div class="action-buttons">

    @if (isAuthenticated()) {

      <!-- PANIER -->

      <a
        tuiButton
        type="button"
        size="m"
        appearance="flat"
        iconStart="@tui.shopping-bag"
        class="btn-cart"
        [routerLink]="['/rental', 'basket', userId]"
        aria-label="Ouvrir mon panier"
        title="Panier"
      >
        <span class="button-label">
          Panier
        </span>
      </a>

      <!-- COMPTE UTILISATEUR -->

      <button
        tuiButton
        type="button"
        appearance="flat"
        iconStart="@tui.user"
        iconEnd="@tui.chevron-down"
        class="btn-account"
        [attr.aria-label]="'Ouvrir le menu de ' + (firstname ?? 'mon compte')"
        [attr.aria-expanded]="openDrawer()"
        aria-haspopup="dialog"
        title="Mon compte"
        (click)="openDrawer.set(true)"
      >
        <span class="button-label user-name">
          {{ firstname }}
        </span>
      </button>

    } @else {

      <!-- CONNEXION -->

      <a
        tuiButton
        type="button"
        size="m"
        appearance="primary"
        iconStart="@tui.user"
        routerLink="/auth/login"
        class="btn-login"
        aria-label="Se connecter"
      >
        <span class="button-label">
          Connexion
        </span>
      </a>

    }

  </div>
</header>


<!-- ==========================================
     MENU LATÉRAL DU COMPTE UTILISATEUR
     ========================================== -->

<tui-drawer
  *tuiPopup="openDrawer()"
  direction="end"
  class="drawer"
  [overlay]="true"
  (tuiClose)="onClose()"
>

  <!-- EN-TÊTE DU MENU -->

  <header class="drawer-header">

    <div class="drawer-heading">

      <div class="drawer-identity">

        <h2 tuiHeader>
          <div tuiTitle>
            Mon compte
          </div>
        </h2>

        <p class="drawer-welcome">
          Bienvenue, {{ firstname }}
        </p>

      </div>

      <!-- FERMETURE -->

      <button
        tuiButton
        type="button"
        appearance="flat"
        size="m"
        class="btn-close"
        aria-label="Fermer le menu"
        (click)="onClose()"
      >
        <tui-icon icon="@tui.x" />
      </button>

    </div>

  </header>


  <!-- =====================================
       LIENS DU COMPTE
       ===================================== -->

  <nav
    class="drawer-links"
    aria-label="Menu utilisateur"
  >

    <!-- PROFIL -->

    <a
      [routerLink]="['user', 'profile']"
      routerLinkActive="nav-active"
      (click)="onClose()"
    >
      <tui-icon icon="@tui.user-round" />

      <span>
        Mon profil
      </span>
    </a>

    <!-- MES OUTILS -->

    <a
      [routerLink]="['user-material', 'my-user-material']"
      routerLinkActive="nav-active"
      (click)="onClose()"
    >
      <tui-icon icon="@tui.wrench" />

      <span>
        Mes outils
      </span>
    </a>

    <!-- MES SERVICES -->

    <a
      [routerLink]="['user-favor', 'my-user-favor']"
      routerLinkActive="nav-active"
      (click)="onClose()"
    >
      <tui-icon icon="@tui.handshake" />

      <span>
        Mes services
      </span>
    </a>

    <!-- MON SOLDE -->

    <a
      [routerLink]="['earn', 'my-earn-this-month', userId]"
      routerLinkActive="nav-active"
      (click)="onClose()"
    >
      <tui-icon icon="@tui.wallet" />

      <span>
        Mon solde
      </span>
    </a>

  </nav>


  <!-- =====================================
       DÉCONNEXION
       ===================================== -->

  <footer class="drawer-footer">

    <button
      tuiButton
      type="button"
      appearance="flat"
      iconStart="@tui.log-out"
      class="btn-logout"
      (click)="logout()"
    >
      Déconnexion
    </button>

  </footer>

</tui-drawer>
